<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rachis — Coming Soon</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:     #080c12;
      --border: rgba(255,255,255,0.07);
      --green:  #3dd68c;
      --white:  #e8edf5;
      --mid:    #8b949e;
      --muted:  #3d4654;
      --mono:   'JetBrains Mono', 'Fira Code', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--mono);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* grid bg */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 10%, transparent 100%);
    }

    /* ambient glow */
    .glow {
      position: fixed; inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 20% 30%, rgba(61,214,140,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 70%, rgba(74,158,255,0.06) 0%, transparent 70%);
    }

    main {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: flex-start;
      max-width: 480px; width: 100%;
    }

    .label {
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
      opacity: 0; animation: up 0.6s ease 0.1s forwards;
    }
    .label-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 7px var(--green);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    h1 {
      margin-top: 20px;
      font-size: clamp(52px, 10vw, 88px);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--white);
      opacity: 0; animation: up 0.7s ease 0.25s forwards;
    }
    h1 .accent { color: var(--green); }

    .rule {
      margin-top: 28px;
      width: 100%; height: 1px;
      background: linear-gradient(90deg, rgba(61,214,140,0.5), rgba(74,158,255,0.3), transparent);
      opacity: 0; animation: expand 0.8s ease 0.45s forwards;
      transform-origin: left;
    }

    .tagline {
      margin-top: 22px;
      font-size: 13px; font-weight: 300;
      color: var(--mid); line-height: 1.7;
      opacity: 0; animation: up 0.6s ease 0.6s forwards;
    }

    footer {
      margin-top: 56px;
      font-size: 10px; letter-spacing: 0.15em;
      color: var(--muted);
      opacity: 0; animation: up 0.6s ease 0.75s forwards;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes expand {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <div class="label">
      <span class="label-dot"></span>
      Coming Soon
    </div>

    <h1>Rach<span class="accent">is</span></h1>

    <div class="rule"></div>

    <p class="tagline">Something new is on its way.</p>

    <footer>© <span id="year"></span> Rachis. All rights reserved.</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
